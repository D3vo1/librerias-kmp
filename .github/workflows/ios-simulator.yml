# Compila la app de iOS para el simulador en una Mac de GitHub
# y deja el .zip listo para subir a Appetize.io
name: iOS Simulator Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # Permite correrlo a mano desde la pestaña "Actions"

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución a gradlew (se pierde al venir de Windows)
        run: chmod +x gradlew

      - name: Versión de Xcode
        run: xcodebuild -version

      - name: Compilar la app para el simulador (arm64, sin firma)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$GITHUB_WORKSPACE/build-ios" \
            build

      - name: Comprimir el .app para Appetize
        run: |
          cd build-ios/Debug-iphonesimulator
          ls
          zip -r -y "$GITHUB_WORKSPACE/LIBRERIAS-ios-simulator.zip" *.app

      - name: Subir el .zip como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: LIBRERIAS-ios-simulator
          path: LIBRERIAS-ios-simulator.zip
